<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Console 인증 완료</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#071019;
    --panel:#101a25;
    --line:#2b3c4f;
    --ink:#e7eef6;
    --sub:#92a7ba;
    --accent:#4da3ff;
    --danger:#ff8e8e;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:
      linear-gradient(rgba(77,163,255,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(77,163,255,.045) 1px,transparent 1px),
      radial-gradient(circle at 50% 0,#14283b 0,var(--bg) 48%);
    background-size:32px 32px,32px 32px,auto;color:var(--ink);
    font-family:Bahnschrift,"Aptos Narrow","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{width:min(520px,100%);background:rgba(16,26,37,.96);
    border:1px solid var(--line);border-top:3px solid var(--accent);
    box-shadow:0 24px 70px rgba(0,0,0,.42);padding:28px}
  .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--accent);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  h1{font-size:22px;margin:9px 0 7px}
  p{color:var(--sub);margin:0;line-height:1.65}
  #callbackStatus.error{color:var(--danger)}
  button{margin-top:20px;border:1px solid #5aa9f7;background:#0c6fc7;color:#fff;
    border-radius:4px;padding:9px 15px;font:600 13px inherit;cursor:pointer}
  button:hover{background:#1582e5}
  button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;
      animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<main aria-labelledby="callbackTitle">
  <div class="eyebrow">Identity gateway / callback</div>
  <h1 id="callbackTitle">인증 응답을 확인하고 있습니다</h1>
  <p id="callbackStatus" role="status" aria-live="polite">
    OAuth state와 PKCE verifier를 검증한 뒤 원래 화면으로 돌아갑니다.
  </p>
  <button id="retryLogin" type="button" hidden>다시 로그인</button>
</main>
<script src="/auth.js"></script>
<script>
const statusNode=document.getElementById('callbackStatus');
const retryButton=document.getElementById('retryLogin');

retryButton.onclick=async()=>{
  retryButton.disabled=true;
  statusNode.className='';
  statusNode.textContent='로그인 화면으로 이동하고 있습니다.';
  try{ await window.DemoAuth.login(); }
  catch(error){
    retryButton.disabled=false;
    statusNode.className='error';
    statusNode.textContent='로그인을 시작하지 못했습니다. 잠시 뒤 다시 시도하세요.';
  }
};

(async()=>{
  try{ await window.DemoAuth.callback(); }
  catch(error){
    statusNode.className='error';
    statusNode.textContent='로그인을 완료하지 못했습니다. 다시 로그인해 주세요.';
    retryButton.hidden=false;
    retryButton.focus();
  }
})();
</script>
</body>
</html>
